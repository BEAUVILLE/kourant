name: Temporary Kourant adherent fix

on:
  push:
    branches: [tmp-adherent-fix-20260814]
    paths:
      - '.github/workflows/tmp-adherent-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-adherent-fix-20260814
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Correct card and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          p=Path('carte-visite.png')
          im=Image.open(p).convert('RGB')
          w,h=im.size
          d=ImageDraw.Draw(im)
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          x1,x2=int(w*.08),int(w*.92)
          y1,y2=int(h*.045),int(h*.105)
          d.rounded_rectangle((x1,y1,x2,y2),radius=max(12,int(h*.018)),fill=(7,55,39),outline=(226,174,43),width=max(2,w//420))
          text='ADHÉRENTS DIGIYLYFE'
          size=max(20,int(h*.028))
          while size>14:
              f=ImageFont.truetype(font_path,size)
              b=d.textbbox((0,0),text,font=f)
              if b[2]-b[0] <= (x2-x1)-50: break
              size-=1
          tw,th=b[2]-b[0],b[3]-b[1]
          d.text(((w-tw)/2,y1+(y2-y1-th)/2-2),text,font=f,fill=(244,199,77))
          im.save(p,'PNG',optimize=True)

          q=Path('index.html')
          s=q.read_text(encoding='utf-8')
          # Show the corrected local card, not the old WordPress image.
          s=s.replace('https://digiylyfe.net/wp-content/uploads/2026/05/ChatGPT-Image-14-mai-2026-03_59_29.png','./carte-visite.png?v=20260814-adherents')
          reps={
            "official:'Cette fiche est une route directe":"official:'<strong>ADHÉRENTS DIGIYLYFE.</strong><br>Cette fiche est une route directe",
            "qrKicker:'📲 QR officiel DIGIYLYFE'":"qrKicker:'📲 QR DIGIYLYFE'",
            "qrTitle:'Scanne la fiche officielle'":"qrTitle:'Scanne la fiche DIGIYLYFE'",
            "shareText:'Électricité · contact direct · 0% commission · QR officiel DIGIYLYFE.'":"shareText:'Électricité · adhérents DIGIYLYFE · contact direct · 0% commission.'",
            "wa:'Bonjour Zal & Kourant, je viens de votre fiche officielle DIGIYLYFE":"wa:'Bonjour Zal & Kourant, je viens de votre fiche DIGIYLYFE",
            "foot:'DIGIY BUILD • fiche officielle":"foot:'DIGIY BUILD • adhérents DIGIYLYFE",
            "official:'This profile is a direct route":"official:'<strong>DIGIYLYFE MEMBERS.</strong><br>This profile is a direct route",
            "qrKicker:'📲 Official DIGIYLYFE QR'":"qrKicker:'📲 DIGIYLYFE QR'",
            "qrTitle:'Scan the official profile'":"qrTitle:'Scan the DIGIYLYFE profile'",
            "official DIGIYLYFE QR":"DIGIYLYFE QR",
            "official DIGIYLYFE profile":"DIGIYLYFE profile",
            "official profile":"DIGIYLYFE profile",
            "official:'Esta ficha es una ruta directa":"official:'<strong>MIEMBROS DIGIYLYFE.</strong><br>Esta ficha es una ruta directa",
            "QR oficial DIGIYLYFE":"QR DIGIYLYFE",
            "ficha oficial DIGIYLYFE":"ficha DIGIYLYFE",
            "ficha oficial":"ficha DIGIYLYFE",
            "official:'Dieses Profil ist ein direkter Weg":"official:'<strong>DIGIYLYFE-MITGLIEDER.</strong><br>Dieses Profil ist ein direkter Weg",
            "Offizieller DIGIYLYFE-QR":"DIGIYLYFE-QR",
            "Offizielles Profil":"DIGIYLYFE-Profil",
            "offizieller DIGIYLYFE-QR":"DIGIYLYFE-QR",
            "offizielles DIGIYLYFE-Profil":"DIGIYLYFE-Profil",
            "offizielles Profil":"DIGIYLYFE-Profil",
            "official:'Questa scheda è una via diretta":"official:'<strong>ADERENTI DIGIYLYFE.</strong><br>Questa scheda è una via diretta",
            "QR ufficiale DIGIYLYFE":"QR DIGIYLYFE",
            "scheda ufficiale DIGIYLYFE":"scheda DIGIYLYFE",
            "scheda ufficiale":"scheda DIGIYLYFE",
            "official:'Dit profiel is een directe route":"official:'<strong>DIGIYLYFE-LEDEN.</strong><br>Dit profiel is een directe route",
            "Officiële DIGIYLYFE-QR":"DIGIYLYFE-QR",
            "officiële DIGIYLYFE-QR":"DIGIYLYFE-QR",
            "officieel DIGIYLYFE-profiel":"DIGIYLYFE-profiel",
            "officiële DIGIYLYFE-profiel":"DIGIYLYFE-profiel",
            "officieel profiel":"DIGIYLYFE-profiel",
            "official:'هذا الملف طريق مباشر":"official:'<strong>أعضاء DIGIYLYFE.</strong><br>هذا الملف طريق مباشر",
            "رمز QR رسمي من DIGIYLYFE":"رمز QR من DIGIYLYFE",
            "رمز DIGIYLYFE رسمي":"رمز DIGIYLYFE",
            "الملف الرسمي":"ملف DIGIYLYFE",
            "ملفكم الرسمي على DIGIYLYFE":"ملفكم على DIGIYLYFE"
          }
          for a,b in reps.items():
              s=s.replace(a,b)
          q.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'ADHÉRENTS DIGIYLYFE' index.html
          grep -q 'carte-visite.png?v=20260814-adherents' index.html
          ! grep -qi 'fiche officielle' index.html
          ! grep -qi 'Official DIGIYLYFE' index.html
      - name: Commit temp result
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html carte-visite.png
          git commit -m 'Kourant : adhérents DIGIYLYFE et wording neutre'
          git push origin HEAD:tmp-adherent-fix-20260814
